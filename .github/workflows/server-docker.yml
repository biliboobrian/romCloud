name: Serveur Docker

# main et pull requests : tests du serveur seulement. Tag v* (ou lancement manuel) : tests puis image
# multi-architecture publiée sur Docker Hub (version et latest).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "server/**"
      - ".github/workflows/server-docker.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-docker.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Publication uniquement hors pull request et si les identifiants Docker Hub sont définis.
      PUSH: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'romcloud' }}/romcloud-server
    steps:
      - uses: actions/checkout@v7

      - name: Identifiants Docker Hub
        if: env.PUSH != 'true'
        run: |
          echo "::warning::Secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN absents : l'image est compilée mais pas publiée."

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags : 1.2.3 / 1.2 / 1 et latest (tag v1.2.3 ; latest aussi pour un lancement manuel sur main), sha-xxxxxxx
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
          labels: |
            org.opencontainers.image.title=RomCloud server
            org.opencontainers.image.description=Serveur de ROMs RomCloud : bibliothèque par système, scraping, API pour l'application Android

      - uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
