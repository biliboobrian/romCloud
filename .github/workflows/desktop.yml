name: Windows

# Application RomCloud pour Windows (Electron) :
#   RomCloud-Windows-<version>-x64.exe       installeur
#   RomCloud-Windows-<version>-portable.exe  version portable (sans installation)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write # création des Releases sur les tags

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")-dev.${{ github.run_number }}"
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Installeur et version portable
        run: npm run dist

      - uses: actions/upload-artifact@v7
        with:
          name: RomCloud-Windows-${{ env.VERSION }}
          path: desktop/dist/*.exe

      - name: Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: desktop/dist/*.exe
