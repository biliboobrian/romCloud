[package]
name = "romcloud"
version = "1.35.3"
description = "RomCloud pour Windows : bibliothèque de jeux du serveur RomCloud, téléchargement à la demande et lancement des émulateurs"
authors = ["biliboobrian"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# TLS de Windows (Schannel) : rien à compiler en C.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
futures-util = "0.3"
zip = { version = "8", default-features = false, features = ["deflate"] }
hex = "0.4"
base64 = "0.22"
# Sauvegardes et états compressés avant l'envoi (gzip), décompressés à la réception.
flate2 = "1"
rand = "0.10"
dirs = "7"
sys-locale = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"
filetime = "0.2"
urlencoding = "2"
# Archives .7z de RPCS3 (PlayStation 3 du moteur intégré, voir managed.rs).
sevenz-rust2 = { version = "0.23", default-features = false, features = ["util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
