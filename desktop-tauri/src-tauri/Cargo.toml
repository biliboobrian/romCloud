[package]
name = "romcloud"
version = "1.72.0"
description = "RomCloud pour Windows : bibliothÃ¨que de jeux du serveur RomCloud, tÃ©lÃ©chargement Ã  la demande et lancement des Ã©mulateurs"
authors = ["biliboobrian"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# TLS de Windows (Schannel) : rien Ã  compiler en C.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
futures-util = "0.3"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Jeux PC compressés en xz par le serveur : décompression (blocs en parallèle).
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz", "optimization"] }
hex = "0.4"
base64 = "0.23"
# Sauvegardes et Ã©tats compressÃ©s avant l'envoi (gzip), dÃ©compressÃ©s Ã  la rÃ©ception.
flate2 = "1"
rand = "0.10"
dirs = "7"
sys-locale = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"
filetime = "0.2"
urlencoding = "2"
# Archives .7z de RPCS3 (PlayStation 3 du moteur intÃ©grÃ©, voir managed.rs).
sevenz-rust2 = { version = "0.24", default-features = false, features = ["util"] }

[dev-dependencies]
# Tests : archives xz écrites comme celles du serveur.
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz", "encoder"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
