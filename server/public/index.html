<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RomCloud</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn only-mobile" id="menuBtn" data-i18n-aria-label="app.systems">☰</button>
    <h1>RomCloud</h1>
    <div class="topbar-right">
      <span id="scraperState" class="pill"></span>
      <button class="btn ghost" id="apksBtn" data-i18n="app.apks"></button>
      <button class="btn ghost" id="jobsBtn"><span data-i18n="app.jobs"></span> <span id="jobsCount" class="count hidden">0</span></button>
      <select id="langSelect" class="lang-select" data-i18n-title="app.language" data-i18n-aria-label="app.language"></select>
      <button class="btn ghost" id="keyBtn" data-i18n-title="app.apiKey">🔑</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span data-i18n="app.systems"></span>
        <button class="btn small" id="addSystemBtn" data-i18n="app.add"></button>
      </div>
      <nav id="systemList" class="system-list"></nav>
      <div class="sidebar-foot">
        <button class="btn ghost small" id="scanAllBtn" data-i18n="app.rescanAll"></button>
      </div>
    </aside>

    <main class="main" id="main">
      <section id="emptyState" class="empty">
        <h2 data-i18n="app.welcome"></h2>
        <p data-i18n="app.welcomeText"></p>
        <button class="btn primary" id="emptyAddBtn" data-i18n="app.addSystem"></button>
      </section>

      <section id="systemView" class="hidden">
        <div class="system-head">
          <div class="system-title">
            <img id="sysHeadImage" class="head-image hidden" alt="">
            <div>
              <h2 id="sysName"></h2>
              <p class="muted" id="sysMeta"></p>
            </div>
          </div>
          <div class="actions">
            <label class="btn primary">
              <span data-i18n="system.addRoms"></span>
              <input type="file" id="fileInput" multiple hidden>
            </label>
            <button class="btn" id="scrapeSysBtn" data-i18n="system.scrape"></button>
            <button class="btn" id="scanSysBtn" data-i18n="system.rescan"></button>
            <button class="btn" id="dupSysBtn" data-i18n="system.duplicates"></button>
            <button class="btn" id="biosSysBtn" data-i18n="system.bios"></button>
            <button class="btn ghost" id="editSysBtn" data-i18n="system.settings"></button>
          </div>
        </div>

        <div id="dropzone" class="dropzone">
          <span data-i18n="system.drop"></span>
          <label class="inline"><input type="checkbox" id="autoScrape" checked> <span data-i18n="system.autoScrape"></span></label>
        </div>
        <div id="uploads" class="uploads"></div>

        <div class="toolbar">
          <input type="search" id="search" data-i18n-placeholder="system.search">
          <select id="statusFilter">
            <option value="" data-i18n="system.filterAll"></option>
            <option value="ok" data-i18n="system.filterScraped"></option>
            <option value="missing" data-i18n="system.filterMissing"></option>
          </select>
          <span class="muted" id="gameCount"></span>
        </div>

        <div id="games" class="games"></div>
      </section>
    </main>
  </div>

  <!-- Ajout de système -->
  <dialog id="addDialog" class="dialog wide">
    <form method="dialog" class="dialog-head">
      <h3 data-i18n="add.title"></h3>
      <button class="icon-btn" data-i18n-aria-label="app.close">✕</button>
    </form>
    <div class="tabs">
      <button class="tab active" data-tab="daijishou" data-i18n="add.tabCatalog"></button>
      <button class="tab" data-tab="custom" data-i18n="add.tabCustom"></button>
    </div>
    <div class="tab-panel" id="tab-daijishou">
      <p class="muted" data-i18n-html="add.catalogIntro"></p>
      <input type="search" id="platformSearch" data-i18n-placeholder="add.filter">
      <div id="platformList" class="platform-list"><p class="muted" data-i18n="add.loading"></p></div>
      <div class="dialog-foot">
        <span class="muted" id="platformSel"></span>
        <button class="btn primary" id="importBtn" disabled data-i18n="add.import"></button>
      </div>
    </div>
    <form class="tab-panel hidden form" id="tab-custom">
      <label><span data-i18n="field.id"></span> <input name="id" required pattern="[a-z0-9][a-z0-9._-]*" placeholder="snes"></label>
      <label><span data-i18n="field.name"></span> <input name="name" required placeholder="Super Nintendo"></label>
      <label><span data-i18n="field.folder"></span> <input name="folder" data-i18n-placeholder="field.folderPlaceholder"></label>
      <label><span data-i18n="field.regex"></span> <input name="filenameRegex" placeholder="^.*\.(sfc|smc|zip)$"></label>
      <label><span data-i18n="field.libretro"></span> <input name="libretroName" placeholder="Nintendo - Super Nintendo Entertainment System"></label>
      <label><span data-i18n="field.ssId"></span> <input name="screenscraperId" type="number" min="1"></label>
      <div class="dialog-foot"><button class="btn primary" data-i18n="add.create"></button></div>
    </form>
  </dialog>

  <!-- Réglages d'un système -->
  <dialog id="sysDialog" class="dialog">
    <form method="dialog" class="dialog-head">
      <h3 data-i18n="sys.title"></h3>
      <button class="icon-btn" data-i18n-aria-label="app.close">✕</button>
    </form>
    <form id="sysForm" class="form">
      <div class="sys-image">
        <div class="sys-image-preview" id="sysImagePreview"></div>
        <div class="sys-image-actions">
          <span class="muted" data-i18n="sys.imageHint"></span>
          <div class="actions">
            <label class="btn small"><span data-i18n="sys.chooseImage"></span><input type="file" id="sysImageInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label>
            <button type="button" class="btn small ghost danger" id="sysImageDelete" data-i18n="sys.remove"></button>
          </div>
        </div>
      </div>
      <label><span data-i18n="field.name"></span> <input name="name" required></label>
      <label><span data-i18n="field.shortname"></span> <input name="shortname"></label>
      <label><span data-i18n="field.regex"></span> <input name="filenameRegex"></label>
      <label><span data-i18n="field.libretro"></span> <input name="libretroName"></label>
      <label><span data-i18n="field.ssId"></span> <input name="screenscraperId" type="number" min="1"></label>
      <p class="muted" id="sysFolder"></p>
      <details id="sysPlayersBox">
        <summary id="sysPlayersSummary"></summary>
        <ul id="sysPlayers" class="players"></ul>
        <div class="copy-players">
          <span class="muted" data-i18n="sys.copyHint"></span>
          <div class="row">
            <select id="copyPlayersFrom"></select>
            <button type="button" class="btn small" id="copyPlayersBtn" data-i18n="sys.copyAdd"></button>
          </div>
        </div>
      </details>
      <div class="dialog-foot split">
        <button type="button" class="btn danger" id="deleteSysBtn" data-i18n="sys.delete"></button>
        <button class="btn primary" data-i18n="sys.save"></button>
      </div>
    </form>
  </dialog>

  <!-- Fiche d'un jeu -->
  <dialog id="gameDialog" class="dialog wide">
    <form method="dialog" class="dialog-head">
      <h3 id="gameDialogTitle" data-i18n="game.title"></h3>
      <button class="icon-btn" data-i18n-aria-label="app.close">✕</button>
    </form>
    <div class="game-edit">
      <div class="media-col">
        <div class="media-slot" data-type="boxart"><span data-i18n="game.boxart"></span><img alt=""><label class="btn small"><span data-i18n="game.replace"></span><input type="file" accept="image/*" hidden></label></div>
        <div class="media-slot" data-type="screenshot"><span data-i18n="game.screenshot"></span><img alt=""><label class="btn small"><span data-i18n="game.replace"></span><input type="file" accept="image/*" hidden></label></div>
      </div>
      <form id="gameForm" class="form">
        <p class="muted mono" id="gameFile"></p>
        <label><span data-i18n="game.fieldTitle"></span> <input name="title" required></label>
        <div class="row">
          <label><span data-i18n="game.releaseDate"></span> <input name="releaseDate"></label>
          <label><span data-i18n="game.players"></span> <input name="players"></label>
          <label><span data-i18n="game.rating"></span> <input name="rating" type="number" step="0.1" min="0" max="5"></label>
        </div>
        <div class="row">
          <label><span data-i18n="game.developer"></span> <input name="developer"></label>
          <label><span data-i18n="game.publisher"></span> <input name="publisher"></label>
        </div>
        <label><span data-i18n="game.genre"></span> <input name="genre"></label>
        <label><span data-i18n="game.description"></span> <textarea name="description" rows="6"></textarea></label>
        <p class="muted" id="gameScrapeInfo"></p>
        <div class="dialog-foot split">
          <div class="actions">
            <button type="button" class="btn" data-scrape="auto" data-i18n="game.scrape"></button>
            <button type="button" class="btn ghost" data-scrape="screenscraper">ScreenScraper</button>
            <button type="button" class="btn ghost" data-scrape="libretro">Libretro</button>
          </div>
          <div class="actions">
            <a class="btn ghost" id="gameDownload" data-i18n="game.download"></a>
            <button type="button" class="btn danger" id="deleteGameBtn" data-i18n="game.delete"></button>
            <button class="btn primary" data-i18n="game.save"></button>
          </div>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Doublons -->
  <dialog id="dupDialog" class="dialog wide">
    <form method="dialog" class="dialog-head">
      <h3 id="dupTitle"></h3>
      <button class="icon-btn" data-i18n-aria-label="app.close">✕</button>
    </form>
    <div class="dup-body">
      <p class="muted" id="dupSummary"></p>
      <div id="dupGroups"></div>
    </div>
    <div class="dup-foot">
      <span class="muted" id="dupSelection"></span>
      <button class="btn danger" id="dupDeleteBtn" disabled data-i18n="dup.deleteSelection"></button>
    </div>
  </dialog>

  <!-- APK des émulateurs Android -->
  <dialog id="apksDialog" class="dialog wide">
    <form method="dialog" class="dialog-head">
      <h3 data-i18n="apks.title"></h3>
      <button class="icon-btn" data-i18n-aria-label="app.close">✕</button>
    </form>
    <div class="dup-body">
      <p class="muted" data-i18n="apks.intro"></p>
      <div id="apksUpload" class="uploads"></div>
      <div id="apksContent"></div>
    </div>
    <div class="dup-foot">
      <span class="muted" data-i18n="apks.addHint"></span>
      <label class="btn primary">
        <span data-i18n="apks.add"></span>
        <input type="file" id="apksInput" accept=".apk" multiple hidden>
      </label>
    </div>
  </dialog>

  <!-- BIOS -->
  <dialog id="biosDialog" class="dialog wide">
    <form method="dialog" class="dialog-head">
      <h3 id="biosTitle"></h3>
      <button class="icon-btn" data-i18n-aria-label="app.close">✕</button>
    </form>
    <div class="dup-body">
      <p class="muted" id="biosSummary"></p>
      <div id="biosContent"></div>
    </div>
    <div class="dup-foot">
      <span class="muted" data-i18n="bios.addHint"></span>
      <label class="btn primary">
        <span data-i18n="bios.add"></span>
        <input type="file" id="biosInput" multiple hidden>
      </label>
    </div>
  </dialog>

  <!-- Tâches -->
  <dialog id="jobsDialog" class="dialog">
    <form method="dialog" class="dialog-head">
      <h3 data-i18n="jobs.title"></h3>
      <button class="icon-btn" data-i18n-aria-label="app.close">✕</button>
    </form>
    <div id="jobsList" class="jobs"></div>
  </dialog>

  <div id="toasts" class="toasts"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
